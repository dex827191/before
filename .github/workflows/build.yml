name: "Build"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  release:
    types:
      - published

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        id: setup_sdk
        uses: android-actions/setup-android@v4
        with:
          # v3 的默认 packages 含已被 SDK 仓库移除的 'tools'，sdkmanager 会 exit 1 导致整步失败。
          # v4 默认改为 platform-tools；这里再显式补齐 compileSdk 35 所需的 platform。
          # build-tools 交给 AGP 按自身默认版本自动补装，避免钉错版本。
          packages: 'platform-tools platforms;android-35'

      - name: Read Versions
        run: |
          echo "XRAY_VERSION=$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV
          echo "GEOIP_VERSION=$(grep 'GEOIP_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV
          echo "GEOSITE_VERSION=$(grep 'GEOSITE_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Keystore and Properties
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > ./store.jks
          echo "storeFile=store.jks" > ./store.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> ./store.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> ./store.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> ./store.properties

      - name: Download Rules Files
        run: |
          wget https://github.com/lhear/v2ray-rules-dat/releases/download/${{ env.GEOIP_VERSION }}/geoip.dat -O ./app/src/main/assets/geoip.dat
          wget https://github.com/lhear/v2ray-rules-dat/releases/download/${{ env.GEOSITE_VERSION }}/geosite.dat -O ./app/src/main/assets/geosite.dat

      - name: Build Xray-core from Source
        run: |
          # -checklinkname=0: Go 1.23+ 收紧了 //go:linkname 校验，而 Xray 的间接依赖
          # github.com/wlynxg/anet v0.0.5（已是该库最新版）仍 linkname 到 net.zoneCache，
          # 会报 "invalid reference to net.zoneCache" 导致链接失败。
          # Set up NDK
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

          # Clone Xray-core source and checkout tag
          git clone https://github.com/XTLS/Xray-core.git
          cd Xray-core
          git checkout ${{ env.XRAY_VERSION }}
          COMMID=$(git rev-parse HEAD | cut -c 1-7)

          # Set common environment variables
          export GOOS=android
          export CGO_ENABLED=1

          # Build Xray-core for ARM64 only.
          echo "Building Xray-core for arm64-v8a..."
          export GOARCH=arm64
          export CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          go build -o xray -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" -v ./main

          XRAY_LIB="../app/src/main/jniLibs/arm64-v8a/libxray.so"
          mkdir -p "$(dirname "$XRAY_LIB")"
          install -m 755 xray "$XRAY_LIB"
          test -s "$XRAY_LIB"
          file "$XRAY_LIB"
          readelf -h "$XRAY_LIB" | grep -q 'AArch64' || {
            echo "ERROR: libxray.so is not an AArch64 ELF library"
            exit 1
          }

      - name: Build HEV SOCKS5 native library
        shell: bash
        run: bash scripts/build-hev-native.sh

      - name: Verify ARM64 native library inputs
        shell: bash
        run: |
          set -euo pipefail
          for lib in \
            app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so \
            app/src/main/jniLibs/arm64-v8a/libxray.so; do
            test -s "$lib" || {
              echo "ERROR: Native library input missing or empty: $lib"
              exit 1
            }
            file "$lib"
          done
          readelf -h app/src/main/jniLibs/arm64-v8a/libxray.so | grep -q 'AArch64'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify ARM64 native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/simplexray-arm64-v8a.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected ARM64 APK not found: $APK"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Checking native libraries in $APK"
          unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+\.so$' | sort
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libhev-socks5-tunnel.so' || {
            echo "ERROR: libhev-socks5-tunnel.so missing from ARM64 APK"
            exit 1
          }
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libxray.so' || {
            echo "ERROR: libxray.so missing from ARM64 APK"
            exit 1
          }
          OTHER_ABI=$(unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u | grep -v '^arm64-v8a$' || true)
          if [ -n "$OTHER_ABI" ]; then
            echo "ERROR: Unexpected ABI(s) packaged: $OTHER_ABI"
            exit 1
          fi

      - name: Find and Copy APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} apks/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplexray-apks
          path: apks/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "simplexray-*"
          merge-multiple: true

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/simplexray-*; do
            gh release upload ${{ github.event.release.tag_name }} $i
          done
